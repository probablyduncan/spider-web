<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <script type="module" src="./config.ts"></script>
</head>

<body>
    <header>
        <div>—|— — —|—</div>
        <h1>A Spider’s Website</h1>
        <div>—|— — —|—</div>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Enabled</legend>
                <label>
                    Spiders!
                    <input type="radio" name="enabled" value="1" />
                </label>
                <label>
                    No Spiders :(
                    <input type="radio" name="enabled" value="0" />
                </label>
            </fieldset>
            <fieldset>
                <legend>Interloper Frequency</legend>
                <label>
                    Generational
                    <input type="radio" name="frequency" value="0" />
                </label>
                <label>
                    Occasional
                    <input type="radio" name="frequency" value="1" />
                </label>
                <label>
                    Crowded
                    <input type="radio" name="frequency" value="2" />
                </label>
                <label>
                    Infestation
                    <input type="radio" name="frequency" value="3" />
                </label>
            </fieldset>
            <fieldset>
                <legend>Interloper Size</legend>
                <label>
                    Pinhead
                    <input type="radio" name="size" value="0" />
                </label>
                <label>
                    Fingernail
                    <input type="radio" name="size" value="1" />
                </label>
                <label>
                    Silver Dollar
                    <input type="radio" name="size" value="2" />
                </label>
                <label>
                    Dinner Plate
                    <input type="radio" name="size" value="3" />
                </label>
            </fieldset>
            <fieldset>
                <legend>Pixelation</legend>
                <label>
                    Crisp
                    <input type="radio" name="resolution" value="0" />
                </label>
                <label>
                    Soggy
                    <input type="radio" name="resolution" value="1" />
                </label>
                <label>
                    Retro
                    <input type="radio" name="resolution" value="2" />
                </label>
                <label>
                    Missing Spectacles
                    <input type="radio" name="resolution" value="3" />
                </label>
            </fieldset>
            <fieldset>
                <legend>Afraid of You?</legend>
                <label>
                    Very afraid
                    <input type="radio" name="scatter" value="2" />
                </label>
                <label>
                    Sometimes
                    <input type="radio" name="scatter" value="1" />
                </label>
                <label>
                    No cowardly spiders
                    <input type="radio" name="scatter" value="0" />
                </label>
            </fieldset>
            <br />
            <br />
            <button id="add-spider" type="button">summon spider</button>
            <br />
            <br />
            <button id="clear-spiders" type="button">clear screen</button>
            <br />
            <br />
            <button id="reset" type="button">reset defaults</button>
        </form>

        <br />
        <br />
        <br />
        <br />
        <br />

        <div>
            your own personal web crawler
        </div>


        <div data-spider-slider>
            <input type="range" min="0" max="1">
            <canvas></canvas>
        </div>
        <br /><br />
        <button id="add-spider">add spider</button>
        <ul>
            <li>
                <label>Worldwide: <input name="worldwide" type="checkbox" /></label>
            </li>
            <li>
                <label>Infestation: <input name="infestation" type="checkbox" /></label>
            </li>
            <li>
                <label>Show Messages: <input name="showMessages" type="checkbox" /></label>
            </li>
        </ul>
        <button type="reset">reset defaults</button>
    </main>
</body>

</html>
